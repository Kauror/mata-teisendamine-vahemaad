name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e:install
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-prod:
    name: Production-build service worker E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      # Builds the production app + generated service worker and exercises SW
      # install / offline reload in a real Chromium (RTM2-H06).
      - run: npm run test:e2e:prod
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-prod
          path: playwright-report/
          retention-days: 7

  docker-release-gate:
    name: Build and boot via docker compose (production path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # RTM3-H03: the compose service declares `.env` as a required env_file, so
      # `.env` MUST exist before the FIRST compose command (build included) or
      # compose aborts on a clean checkout. Generate it here with the app's own
      # hasher on the runner — not inside the image via `docker compose run`, which
      # would itself need `.env` first (the chicken-and-egg the gate used to hit).
      - name: Generate a production .env before any compose command
        run: |
          SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))")
          # Same hasher the container ships. Invoke the script directly so the PIN
          # is argv[2]; the `npm run auth:hash --` alias swallows the argument.
          PIN_HASH=$(npx tsx scripts/hash-secret.ts 1234 | tr -d '\r')
          # The hash contains '$'; it MUST be single-quoted so compose does not
          # interpolate it (this is the exact failure RTM2-C01 guards against).
          {
            echo "APP_ACCESS_PIN_HASH='$PIN_HASH'"
            echo "APP_SESSION_SECRET_CURRENT='$SECRET'"
            echo "APP_ORIGIN=https://ci.example.com"
            echo "OFFLINE_PROTOCOL_V2_ENABLED=1"
          } > .env
      - name: Build the production image via compose
        run: docker compose build
      - name: docker compose config must keep the hash byte-for-byte intact
        run: |
          docker compose config
          RESOLVED=$(docker compose config --format json | node -e "const fs=require('fs');let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const c=JSON.parse(s);process.stdout.write(c.services.app.environment.APP_ACCESS_PIN_HASH||'')})")
          EXPECTED=$(grep -oP "(?<=APP_ACCESS_PIN_HASH=').*(?=')" .env)
          echo "resolved: $RESOLVED"
          test "$RESOLVED" = "$EXPECTED" || { echo "PIN hash was mangled by compose interpolation"; exit 1; }
      - name: Start via compose (verified startup must pass)
        run: docker compose up -d
      - name: Wait for the container to report healthy
        run: |
          for i in $(seq 1 40); do
            STATUS=$(docker inspect --format '{{ .State.Health.Status }}' pikkuste-harjutaja 2>/dev/null || echo starting)
            echo "health: $STATUS"
            [ "$STATUS" = "healthy" ] && exit 0
            [ "$STATUS" = "unhealthy" ] && break
            sleep 3
          done
          echo "Container did not become healthy"; docker compose logs; exit 1
      - name: Verified-startup log must confirm database verification
        run: docker compose logs 2>&1 | grep -q "Database startup verification passed"
      - name: Tear down
        if: always()
        run: docker compose down -v || true
