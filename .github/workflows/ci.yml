name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  security:
    name: Production dependency, secret and configuration gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail on fixable high/critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Fail on detected secrets or high/critical deployment misconfiguration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'

  unit:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-prod:
    name: Production-build service worker E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      # Builds the production app + generated service worker and exercises SW
      # install / offline reload in a real Chromium (RTM2-H06).
      - run: PW_TEST_PORT=3100 CI=1 npm run test:e2e:prod
      - name: Build and test must not alter tracked or unignored files
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-prod
          path: playwright-report/
          retention-days: 7

  docker-release-gate:
    name: Build and boot via docker compose (production path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm the checked-out release candidate SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # RTM3-H03: the compose service declares `.env` as a required env_file, so
      # `.env` MUST exist before the FIRST compose command (build included) or
      # compose aborts on a clean checkout. Generate it here with the app's own
      # hasher on the runner — not inside the image via `docker compose run`, which
      # would itself need `.env` first (the chicken-and-egg the gate used to hit).
      - name: Generate a production .env before any compose command
        run: |
          SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))")
          # The exact documented operator command (RTM4-C02): it now hashes the PIN
          # rather than the literal '--'.
          PIN_HASH=$(npm run --silent auth:hash -- 1234 | tr -d '\r')
          PARENT_HASH=$(npm run --silent auth:hash -- parent-password-for-ci | tr -d '\r')
          # The hash contains '$'; it MUST be single-quoted so compose does not
          # interpolate it (this is the exact failure RTM2-C01 guards against).
          {
            echo "APP_ACCESS_PIN_HASH='$PIN_HASH'"
            echo "PARENT_PASSWORD_HASH='$PARENT_HASH'"
            echo "APP_SESSION_SECRET_CURRENT='$SECRET'"
            echo "APP_ORIGIN=https://ci.example.com"
            echo "OFFLINE_PROTOCOL_V2_ENABLED=1"
            echo "CLOUDFLARE_TUNNEL_TOKEN=ci-config-only-token"
            echo "APP_DATA_DIR=./data"
          } > .env
      - name: Build the production image via compose
        # .git is excluded from the build context, so the calendar version is
        # computed on the runner and handed to the image as a build arg.
        run: APP_VERSION=$(npm run --silent version:print) docker compose build
      - name: Fail on fixable high/critical production image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pikkuste-harjutaja:local
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: docker compose config must keep the hash byte-for-byte intact
        run: |
          docker compose config
          # `docker compose config` prints a literal '$' as '$$', so that its own
          # output stays a valid compose file when fed back in. Both hashes are
          # made of '$'-separated fields, so the printed form never equalled the
          # .env form and this check could not pass as written -- it has failed
          # identically on every run that reached it. Undo the doubling before
          # comparing.
          #
          # This does not soften the guard. What it watches for is compose
          # expanding $v / $N / $p as variables, which deletes the '$' and the
          # name after it; that damage does not come back when '$$' is undoubled,
          # so a genuinely mangled hash still fails here.
          resolved_env() {
            docker compose config --format json \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const c=JSON.parse(s);process.stdout.write(c.services.app.environment['$1']||'')})" \
              | sed 's/\$\$/$/g'
          }
          RESOLVED=$(resolved_env APP_ACCESS_PIN_HASH)
          EXPECTED=$(grep -oP "(?<=APP_ACCESS_PIN_HASH=').*(?=')" .env)
          RESOLVED_PARENT=$(resolved_env PARENT_PASSWORD_HASH)
          EXPECTED_PARENT=$(grep -oP "(?<=PARENT_PASSWORD_HASH=').*(?=')" .env)
          echo "resolved: $RESOLVED"
          echo "expected: $EXPECTED"
          test "$RESOLVED" = "$EXPECTED" || { echo "PIN hash was mangled by compose interpolation"; exit 1; }
          test "$RESOLVED_PARENT" = "$EXPECTED_PARENT" || { echo "Parent hash was mangled by compose interpolation"; exit 1; }
          docker compose --profile tunnel config >/dev/null
      - name: The mounted data directory must be writable by the image's user
        run: |
          # The image creates /data owned by `node` and drops to that user, but
          # the bind mount lays a host directory over the top of it, and a host
          # directory the daemon invents belongs to root -- so the runtime user
          # cannot open the database and the container dies with "unable to open
          # database file". An operator making a real data directory gives it the
          # right owner; CI has to say so itself.
          #
          # Mode rather than ownership because two different users need this
          # directory: the container writes the database as uid 1000, and the
          # audit step later reads it back from the host as the runner. It lives
          # for the length of one job on a throwaway machine.
          mkdir -p data
          chmod 777 data
          ls -ld data
      - name: Start via compose (verified startup must pass)
        run: docker compose up -d
      - name: Wait for the container to report healthy
        run: |
          for i in $(seq 1 40); do
            STATUS=$(docker inspect --format '{{ .State.Health.Status }}' pikkuste-harjutaja 2>/dev/null || echo starting)
            echo "health: $STATUS"
            [ "$STATUS" = "healthy" ] && exit 0
            [ "$STATUS" = "unhealthy" ] && break
            sleep 3
          done
          echo "Container did not become healthy"; docker compose logs; exit 1
      - name: Verified-startup log must confirm database verification
        run: docker compose logs 2>&1 | grep -q "Database startup verification passed"
      - name: Application must have no published host port
        run: test "$(docker inspect --format '{{json .HostConfig.PortBindings}}' pikkuste-harjutaja)" = "null"
      - name: Tunnel-style probe reaches the app only over the named network
        run: docker run --rm --network pikkuste-harjutaja-edge node:22.22.3-alpine3.23@sha256:968df39aedcea65eeb078fb336ed7191baf48f972b4479711397108be0966920 node -e "fetch('http://pikkuste-harjutaja:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      - name: Mounted data survives container replacement
        run: |
          docker compose exec -T app node -e "require('fs').writeFileSync('/data/container-replacement-probe','persisted')"
          docker compose up -d --force-recreate app
          for i in $(seq 1 40); do
            [ "$(docker inspect --format '{{ .State.Health.Status }}' pikkuste-harjutaja 2>/dev/null || true)" = "healthy" ] && break
            sleep 3
          done
          test "$(docker inspect --format '{{ .State.Health.Status }}' pikkuste-harjutaja)" = "healthy"
          docker compose exec -T app node -e "process.exit(require('fs').readFileSync('/data/container-replacement-probe','utf8')==='persisted'?0:1)"
      - name: WAL-safe database audit passes on the running safe CI database
        run: npm run audit:v2 -- ./data/maths-game.sqlite | tee database-audit.txt
      - name: Record exact release candidate and image identifiers
        run: |
          echo "release_sha=$(git rev-parse HEAD)" > release-evidence.txt
          echo "image_id=$(docker image inspect --format '{{.Id}}' pikkuste-harjutaja:local)" >> release-evidence.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate-evidence
          path: |
            database-audit.txt
            release-evidence.txt
          retention-days: 30
      - name: Graceful stop completes within the timeout
        run: |
          START=$(date +%s)
          docker compose stop -t 20 app
          ELAPSED=$(($(date +%s)-START))
          test "$ELAPSED" -lt 25
          test "$(docker inspect --format '{{.State.ExitCode}}' pikkuste-harjutaja)" = "0"
      - name: Tear down
        if: always()
        run: docker compose down -v || true
