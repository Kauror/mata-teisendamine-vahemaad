services:
  app:
    build: .
    container_name: pikkuste-harjutaja
    init: true
    # Required production secrets and switches live in .env (copy .env.example).
    # Startup (verified-start -> Next.js) refuses to boot if APP_ACCESS_PIN_HASH,
    # APP_SESSION_SECRET_CURRENT or APP_ORIGIN are missing/invalid, if APP_ORIGIN
    # is not HTTPS, or if the advertised offline protocol is not actually enabled.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MATHS_GAME_DB_FILE: /data/maths-game.sqlite
      MATHS_GAME_BACKUP_DIR: /data/backups
    volumes:
      - ${APP_DATA_DIR:-./data}:/data
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      # /api/healthz is public (no family session), so the probe reflects real
      # liveness. The app boots only after database verification passes, so a
      # healthy container is also a verified one.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:2026.7.0
    profiles: ["tunnel"]
    init: true
    command: tunnel --no-autoupdate --metrics 127.0.0.1:2000 run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - edge
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  edge:
    name: pikkuste-harjutaja-edge
    driver: bridge
