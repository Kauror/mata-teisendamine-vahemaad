services:
  app:
    build:
      context: .
      args:
        # Calendar version (last commit date). Compose cannot run git itself, so
        # build with:
        #   APP_VERSION=$(npm run --silent version:print) docker compose build
        APP_VERSION: ${APP_VERSION:-}
    image: pikkuste-harjutaja:${APP_IMAGE_TAG:-local}
    container_name: pikkuste-harjutaja
    init: true
    # Required production secrets and switches live in .env (copy .env.example).
    # Startup (verified-start -> Next.js) refuses to boot if APP_ACCESS_PIN_HASH,
    # APP_SESSION_SECRET_CURRENT or APP_ORIGIN are missing/invalid, if APP_ORIGIN
    # is not HTTPS, or if the advertised offline protocol is not actually enabled.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MATHS_GAME_DB_FILE: /data/maths-game.sqlite
      MATHS_GAME_BACKUP_DIR: /data/backups
      # Private, not in the repository: the deploy places it in the data folder.
      SCHOOL_TIMETABLE_FILE: /data/school-timetable.json
    volumes:
      - ${APP_DATA_DIR:-./data}:/data
    networks:
      - edge
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # A failing start (corrupt database, failed migration) must not loop
    # forever: stop after five failed starts and wait for a person (C2). The
    # startup backup also skips itself after three copies in an hour.
    # Check after an Unraid reboot that the container comes back up; if the
    # host does not restart on-failure containers, start it from the deploy
    # folder with `docker compose up -d --no-deps app`.
    restart: on-failure:5
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # /api/healthz is public (no family session). It reads SQLite, takes and
      # releases the write lock and checks free space on the data volume, so a
      # locked, unreadable or full database is unhealthy. The app boots only
      # after database verification passes.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:2026.7.0@sha256:5e49861633763e8933475477c20bae6039ed47f32c1d267a34babc347f28f0df
    profiles: ["tunnel"]
    init: true
    command: tunnel --no-autoupdate --metrics 127.0.0.1:2000 run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - edge
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 256m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    name: pikkuste-harjutaja-edge
    driver: bridge
